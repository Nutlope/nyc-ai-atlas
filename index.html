<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="A high-fidelity 3D interactive map of New York City's AI startups, neighborhood by neighborhood."
    />
    <title>NYC AI Atlas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app" class="atlas-shell">
      <canvas id="scene" aria-label="3D interactive map of NYC AI startups"></canvas>
      <div id="labelsLayer" class="labels-layer" aria-hidden="false"></div>

      <header class="topbar" aria-label="NYC AI Atlas controls">
        <a class="brand-mark" href="#" aria-label="NYC AI Atlas home">
          <span class="brand-mark__glyph" aria-hidden="true"></span>
          <span class="brand-mark__text">NYC AI Atlas</span>
        </a>
        <button id="searchTrigger" class="search-trigger" type="button" aria-haspopup="dialog" aria-label="Search companies">
          <svg class="search-trigger__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span class="search-trigger__label">Search startups…</span>
          <span class="search-trigger__keys"><kbd>⌘</kbd><kbd>K</kbd></span>
        </button>
        <div class="topbar__meta" aria-label="Map summary">
          <span class="topbar__stat"><strong>47</strong> AI startups</span>
          <span class="topbar__stat"><strong>8</strong> neighborhoods</span>
        </div>
      </header>

      <aside class="legend-panel" aria-label="Neighborhood chapters">
        <div class="panel-heading">
          <span class="panel-heading__spark" aria-hidden="true"></span>
          <div>
            <p>New York City</p>
            <h1>AI startup map</h1>
          </div>
        </div>
        <nav id="areaList" class="area-list" aria-label="Explore by area"></nav>
      </aside>

      <section id="detailCard" class="detail-card" aria-live="polite"></section>

      <div class="control-stack" aria-label="Map display controls">
        <button id="labelToggle" class="control-btn" type="button">
          <span>Companies</span><strong>All</strong><span>/ Curated</span>
        </button>
      </div>

      <nav id="progressRail" class="progress-rail" aria-label="Neighborhood navigation"></nav>

      <aside class="mini-map" aria-label="Mini map">
        <svg id="miniMapSvg" viewBox="0 0 120 160" role="img" aria-label="Simplified NYC outline and active area">
          <path
            class="mini-map__land"
            d="M48 10 L72 18 L82 48 L76 84 L84 120 L62 148 L42 130 L48 92 L38 56 Z"
          />
          <path class="mini-map__brooklyn" d="M76 92 L110 104 L104 150 L66 148 L84 120 Z" />
          <g id="miniMapPoints"></g>
        </svg>
        <p>N ↑ · NYC</p>
      </aside>

      <footer class="source-line">
        <span>47 AI startups across NYC · Company data from the <a href="https://airtable.com/appK49oThZBOTSYlX/shr5Chudz00G5jxwW/tblFlqQHeAvsVxLNI" target="_blank" rel="noreferrer">Lux NYC AI database</a> · Updated June 2026</span>
      </footer>
    </div>

    <dialog id="searchModal" class="search-modal" aria-label="Search AI startups">
      <div class="search-modal__bar">
        <svg class="search-modal__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="companySearch" type="search" autocomplete="off" placeholder="Search 47 AI startups by name, sector, or area…" aria-label="Search companies" />
        <kbd class="search-modal__esc">esc</kbd>
      </div>
      <div id="searchResults" class="search-results" role="listbox"></div>
    </dialog>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
