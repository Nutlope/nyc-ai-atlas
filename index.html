<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="High-fidelity 3D interactive maps of the world's AI startup clusters, neighborhood by neighborhood."
    />
    <title>AI Atlas</title>

    <!-- Open Graph / social cards. Hash routes never reach a server, so a
         shared #/city/… link gets this generic card, not a per-city one. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AI Atlas" />
    <meta property="og:title" content="AI Atlas: 3D maps of the world's AI startup clusters" />
    <meta
      property="og:description"
      content="Interactive 3D maps of where AI companies actually are, explored block by block. New York and San Francisco."
    />
    <meta property="og:image" content="./og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="3D map showing AI startups across a city" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI Atlas: 3D maps of the world's AI startup clusters" />
    <meta
      name="twitter:description"
      content="Interactive 3D maps of where AI companies actually are, explored block by block."
    />
    <meta name="twitter:image" content="./og.jpg" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preload" href="./fonts/GeistVF.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./src/styles.css" />

    <!-- Privacy-friendly analytics by Plausible -->
    <script async src="https://plausible.io/js/pa-DCryjN2uYclWhms4rKg2g.js"></script>
    <script>
      window.plausible =
        window.plausible ||
        function () {
          (plausible.q = plausible.q || []).push(arguments);
        };
      plausible.init =
        plausible.init ||
        function (options) {
          plausible.o = options || {};
        };
      plausible.init();
    </script>
  </head>
  <body>
    <div id="app" class="atlas-shell">
      <canvas id="scene" aria-label="3D interactive map of AI startups"></canvas>
      <div id="labelsLayer" class="labels-layer" aria-hidden="false"></div>

      <div class="hud-left">
        <aside class="rail" aria-label="AI Atlas navigation">
          <a class="brand" href="#" aria-label="AI Atlas home">
            <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
              <!-- Map pin: the atlas mark. Balanced teardrop with a round
                   aperture, drawn upright so it reads at any size. -->
              <path
                fill="currentColor"
                fill-rule="evenodd"
                d="M16 29.5 C12.2 23.5 7.5 17.5 7.5 12 A8.5 8.5 0 1 1 24.5 12 C24.5 17.5 19.8 23.5 16 29.5 Z M16 8.8 A3.2 3.2 0 1 0 16 15.2 A3.2 3.2 0 1 0 16 8.8 Z"
              />
            </svg>
            <span class="brand__text">
              <h1 id="brandTitle">AI Atlas</h1>
              <span class="brand__sub" id="brandSub"></span>
            </span>
          </a>

          <nav id="areaList" class="area-list" aria-label="Explore by area"></nav>

          <div class="rail__foot">
            <div id="pinLegend" class="pin-legend"></div>
            <a
              class="rail__cta"
              href="https://github.com/Nutlope/nyc-ai-atlas/blob/main/CONTRIBUTING.md"
              target="_blank"
              rel="noreferrer noopener"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .5C5.37.5 0 5.78 0 12.29c0 5.2 3.44 9.6 8.21 11.16.6.11.82-.25.82-.56 0-.28-.01-1.02-.02-2-3.34.7-4.04-1.58-4.04-1.58-.55-1.36-1.33-1.73-1.33-1.73-1.09-.73.08-.71.08-.71 1.2.08 1.83 1.21 1.83 1.21 1.07 1.8 2.81 1.28 3.5.98.11-.76.42-1.28.76-1.57-2.67-.3-5.47-1.3-5.47-5.79 0-1.28.47-2.33 1.23-3.15-.12-.29-.53-1.49.12-3.11 0 0 1-.31 3.3 1.2.96-.26 1.98-.39 3-.4 1.02.01 2.04.14 3 .4 2.28-1.51 3.29-1.2 3.29-1.2.65 1.62.24 2.82.12 3.11.77.82 1.23 1.87 1.23 3.15 0 4.5-2.81 5.48-5.49 5.77.43.36.81 1.09.81 2.2 0 1.59-.01 2.87-.01 3.26 0 .31.21.68.83.56C20.57 21.88 24 17.48 24 12.29 24 5.78 18.63.5 12 .5Z"/></svg>
              <span>Add your startup</span>
              <span class="rail__cta-arrow" aria-hidden="true">↗</span>
            </a>
            <p class="rail__hint"><kbd>↑</kbd><kbd>↓</kbd> areas · <kbd>⌘K</kbd> search · click a pin</p>
            <p class="rail__credit" id="railCredit"></p>
          </div>
        </aside>

        <section id="detailCard" class="detail-card is-hidden" aria-live="polite"></section>
      </div>

      <div class="hud-top-right">
        <div id="citySwitcher" class="city-switcher" role="group" aria-label="Choose a city"></div>
        <button id="searchTrigger" class="search-trigger" type="button" aria-haspopup="dialog" aria-label="Search companies">
          <svg class="search-trigger__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span class="search-trigger__label">Search</span>
          <kbd>⌘K</kbd>
        </button>
        <a class="icon-btn" href="https://github.com/Nutlope/nyc-ai-atlas" target="_blank" rel="noreferrer noopener" aria-label="View source on GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .5C5.37.5 0 5.78 0 12.29c0 5.2 3.44 9.6 8.21 11.16.6.11.82-.25.82-.56 0-.28-.01-1.02-.02-2-3.34.7-4.04-1.58-4.04-1.58-.55-1.36-1.33-1.73-1.33-1.73-1.09-.73.08-.71.08-.71 1.2.08 1.83 1.21 1.83 1.21 1.07 1.8 2.81 1.28 3.5.98.11-.76.42-1.28.76-1.57-2.67-.3-5.47-1.3-5.47-5.79 0-1.28.47-2.33 1.23-3.15-.12-.29-.53-1.49.12-3.11 0 0 1-.31 3.3 1.2.96-.26 1.98-.39 3-.4 1.02.01 2.04.14 3 .4 2.28-1.51 3.29-1.2 3.29-1.2.65 1.62.24 2.82.12 3.11.77.82 1.23 1.87 1.23 3.15 0 4.5-2.81 5.48-5.49 5.77.43.36.81 1.09.81 2.2 0 1.59-.01 2.87-.01 3.26 0 .31.21.68.83.56C20.57 21.88 24 17.48 24 12.29 24 5.78 18.63.5 12 .5Z"/></svg>
        </a>
      </div>

      <aside class="mini-map" aria-label="Mini map">
        <!-- Outline paths are injected per city by renderMiniMap(). -->
        <svg id="miniMapSvg" viewBox="0 0 120 160" role="img">
          <g id="miniMapPoints"></g>
        </svg>
        <p></p>
      </aside>

    </div>

    <dialog id="searchModal" class="search-modal" aria-label="Search AI startups">
      <div class="search-modal__bar">
        <svg class="search-modal__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="companySearch" type="search" autocomplete="off" aria-label="Search companies" />
        <kbd class="search-modal__esc">esc</kbd>
      </div>
      <div id="searchResults" class="search-results" role="listbox"></div>
    </dialog>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
